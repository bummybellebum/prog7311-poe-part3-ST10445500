services:
  glms-sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_P@ssw0rd"
    ports:
      - "1433:1433"
    volumes:
      - glms-sql-server-data:/var/opt/mssql

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - glms-sql-server-db

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=glms-sql-server-db,1433;Database=GLMSDb;User Id=sa;Password=Your_strong_P@ssw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "8082:8080"
    depends_on:
      - glms-sql-server-db
      - glms-backend-api

volumes:
  glms-sql-server-data:
