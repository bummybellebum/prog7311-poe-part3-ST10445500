name: glms-stack

services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "14333:1433"
    volumes:
      - glms-sql-server-data:/var/opt/mssql
    networks:
      - glms-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=${MSSQL_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"

      Jwt__Key: "${Jwt__Key}"
      Jwt__Issuer: "${Jwt__Issuer}"
      Jwt__Audience: "${Jwt__Audience}"
      Jwt__ExpiryMinutes: "${Jwt__ExpiryMinutes}"

      FileStorage__ContractsPath: "${FileStorage__ContractsPath}"

      SeedData__Enabled: "${SeedData__Enabled}"
      Admin__Email: "${Admin__Email}"
      Admin__Password: "${Admin__Password}"

      CurrencyApi__BaseUrl: "${CurrencyApi__BaseUrl}"
      CurrencyApi__DefaultFromCurrency: "${CurrencyApi__DefaultFromCurrency}"
      CurrencyApi__DefaultToCurrency: "${CurrencyApi__DefaultToCurrency}"
    ports:
      - "8080:8080"
    volumes:
      - glms-contract-uploads:/app/uploads/contracts
    networks:
      - glms-network
    depends_on:
      sql-server-db:
        condition: service_healthy

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"

      ApiSettings__BaseUrl: "${ApiSettings__BaseUrl}"
    ports:
      - "8082:8080"
    networks:
      - glms-network
    depends_on:
      glms-backend-api:
        condition: service_started

volumes:
  glms-sql-server-data:
  glms-contract-uploads:

networks:
  glms-network:
    driver: bridge