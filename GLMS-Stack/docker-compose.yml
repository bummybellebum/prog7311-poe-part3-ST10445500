name: glms-stack

services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_P@ssw0rd"
    ports:
      - "1433:1433"
    volumes:
      - glms-sql-server-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend-api:
    build:
      context: ..
      dockerfile: GLMS.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "8080:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy

  frontend-web:
    build:
      context: ..
      dockerfile: GLMS.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=GLMSDb;User Id=sa;Password=Your_strong_P@ssw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "8082:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy
      backend-api:
        condition: service_started

volumes:
  glms-sql-server-data:
    name: glms-sql-server-data
